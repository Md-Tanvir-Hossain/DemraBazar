<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        .container3 {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;

        }


        p {
            color: #555;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        input {
            padding: 10px;
            border: none;
            border-bottom: 2px solid #3498db;
            font-size: 16px;
            color: #333;
            background-color: #fff;
            transition: border-bottom 0.3s ease;
        }

        input:focus {
            outline: none;
            border-bottom: 2px solid #e74c3c;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        * {
            margin: 0px;
            font-family: Arial;
            border: border-box;

        }

        .navbar {
            height: 80px;
            background-color: #213b52;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-bottom: 1.5px solid white;
        }

        .nav-logo {
            height: 50px;
            width: 100px;
        }

        .logo a {
            width: 10%;
            height: 50px;
            color: white;
            text-decoration: none;
            margin-right: 100%;
        }

        .hi {
            margin-right: 80%;
        }

        .border {
            border: 1.5px solid transparent;
        }

        .border:hover {
            border: 1.5px solid white;
        }

        .add-icon {
            display: flex;
            align-items: center;
        }

        span {
            font-size: 0.7rem;
        }

        .nov-second {
            font-size: 0.83rem;
            font-weight: 700;
        }

        .nav-cart i {
            font-size: 35px;
        }

        .nav-cart {
            font-size: 0.85rem;
            font-weight: 700;
        }

        #footer {
            position: absolute;
            bottom: -69px;
            left: 0;
            right: 0;
            z-index: 2;
            background-image: url("footer-bg.jpg");
            color: #fff;
            font-size: 14px;
        }

        .container footer-bottom clearfix {
            background-image: url("footer-bg.jpg");
            background-size: cover;
        }

        #footer::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #213b52;
            z-index: 1;
        }

        #footer .footer-top {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px;
        }

        #footer .footer-top h3 {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            position: relative;
            font-family: "Poppins", sans-serif;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        #footer .footer-top p {
            font-size: 15;
            font-style: italic;
            margin: 30px 0 0 0;
            padding: 0;
        }

        #footer .footer-top .footer-newsletter {
            text-align: center;
            font-size: 15px;
            margin-top: 30px;
        }

        #footer .footer-top .footer-newsletter form {
            background: #fff;
            padding: 6px 10px;
            position: relative;
            border-radius: 50px;
            box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        #footer .footer-top .footer-newsletter form input[type=email] {
            border: 0;
            padding: 4px 8px;
            width: calc(100% - 100px);
        }

        #footer .footer-top .footer-newsletter form input[type=submit] {
            position: absolute;
            top: 0;
            right: -1px;
            bottom: 0;
            border: 0;
            background: none;
            font-size: 16px;
            padding: 0 20px;
            background: #fdc134;
            color: #fff;
            transition: 0.3s;
            border-radius: 50px;
            box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1);
        }

        #footer .footer-top .footer-newsletter form input[type=submit]:hover {
            background: #fcb102;
        }

        #footer .footer-bottom {
            border-top: 1.5px solid white;
            z-index: 2;
            position: relative;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        #footer .copyright {
            text-align: center;
            float: left;
            margin-left: 42%;
        }

        #footer .credits {
            float: right;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 768px) {

            #footer .copyright,
            #footer .credits {
                padding: 5px;
                float: none;
                text-align: center;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="container d-flex align-items-center justify-content-between">
                {% csrf_token %}
                <div class="logo">
                    <h1 class="hi">
                        <a class="tai" href="{% url 'index' %}">DemraBazar<span>.</span></a>
                    </h1>
                </div>
            </div>
        </div>
    </header>
    <p id="thankYouMessage" style="color: #4caf50;">Password reset successful!</p>
    <div class="container3">
        <h1>Reset Password</h1>
        <form class='form' method='post'>
            {% csrf_token %}

            {{form}}
            <button type="submit">Send</button>
        </form>
    </div>

    <footer id="footer">
        <div class="footer-top">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <h3>DemraBazar</h3>
                        <h4>"Unlock Opportunities, Subscribe for Success!".</h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="container footer-bottom clearfix">
            <div class="copyright">
                &copy; Copyright <strong><span>DemraBazar</span></strong>. All Rights Reserved
            </div>
        </div>
    </footer>
</body>

</html>
