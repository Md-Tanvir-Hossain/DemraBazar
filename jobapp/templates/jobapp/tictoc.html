#game-container {
    display: flex;

<body>
  <header>
    <div class="navbar">
      <div class="container d-flex align-items-center justify-content-between">
        {% csrf_token %}
        <div class="logo">
          <h1>
            <a href="{% url 'index' %}">DemraBazar<span>.</span></a>
          </h1>
          <!-- Uncomment below if you prefer to use an image logo -->
          <!-- <a href="index.html"><img src="assets/img/logo.png" alt="" class="img-fluid"></a>-->
        </div>
      </div>
  </header>
  <div id="game-container">
    <div id="board-container">
      <div id="board"></div>
      <div id="result"></div>
    </div>

    <div id="sidebar">
      <h2>Select Player</h2>
      <button onclick="startGame('X')">X</button>
      <button onclick="startGame('O')">O</button>
    </div>
  </div>

  <script>
    const board = document.getElementById("board");
    const result = document.getElementById("result");
    let currentPlayer;
    let gameBoard;
    let gameActive = false;

    function checkWinner() {
      const winPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (
          gameBoard[a] &&
          gameBoard[a] === gameBoard[b] &&
          gameBoard[a] === gameBoard[c]
        ) {
          return gameBoard[a];
        }
      }

      if (!gameBoard.includes("")) {
        return "T";
      }

      return null;
    }

    function handleClick(index) {
      if (!gameActive || gameBoard[index] !== "") {
        return;
      }

      gameBoard[index] = currentPlayer;
      renderBoard();

      const winner = checkWinner();
      if (winner) {
        gameActive = false;
        if (winner === "T") {
          result.textContent = "It's a tie!";
        } else {
          result.textContent = `Player ${winner} wins!`;
        }
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
      }
    }

    function renderBoard() {
      board.innerHTML = "";
      gameBoard.forEach((value, index) => {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.textContent = value;
        cell.addEventListener("click", () => handleClick(index));
        board.appendChild(cell);
      });
    }

    function startGame(player) {
      currentPlayer = player;
      gameBoard = Array(9).fill("");
      gameActive = true;
      result.textContent = "";
      renderBoard();
    }
  </script>

          </div>

        &copy; Copyright <strong><span>DemraBazar</span></strong>. All Rights Reserved
      </div>
  </footer>
</body>
