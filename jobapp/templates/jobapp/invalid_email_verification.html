<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      background-color: #213b52;
      font-family: sans-serif;
    }


    h1 {
      text-align: center;
      color: white;
      margin-top: 10vh;
      font-size: 3em;
      margin-bottom: 10%;
    }

    @keyframes slideInFromTop {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2em;
      overflow: hidden;
      white-space: nowrap;
      animation: slideInFromTop 1s ease-in-out;
    }

    h1 {
      font-size: 2em;
      overflow: hidden;
      white-space: nowrap;
      animation: slideInFromTop 1s ease-in-out;
    }

    h1 {
      font-size: 2em;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      transition: color 0.3s ease-in-out;
    }

    h1::after {
      content: '';
      display: block;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: white;
      /* Set the underline color */
      transition: width 0.3s ease-in-out;
    }

    h1:hover {
      color: white;
      /* Change the text color on hover */
    }

    h1:hover::after {
      width: 100%;
      /* Expand the underline on hover */
    }

    h1 {
      font-size: 3em;
      overflow: hidden;
      white-space: nowrap;
      transition: transform 0.3s ease-in-out;
    }

    h1:hover {
      transform: scale(1.1);
      /* Scale the text on hover */
    }

    p {
      text-align: center;
      color: white;
      font-size: 1.5em;
      animation: fadeIn 2s ease-in-out;
      margin-top: 5vh;
      margin-bottom: 120%;
    }

    a {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      overflow: hidden;
      padding: 20px 40px;
      font-size: 1.5em;
      text-decoration: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      box-shadow: 0 20px 50px rgb(255 255 255 / 5%);
      margin-bottom: 15%;
    }

    a:before {
      position: absolute;
      width: 50%;
      top: 2px;
      left: 2px;
      bottom: 2px;
      content: "";
      background: rgb(142 255 240 / 10%);
    }

    a span:nth-child(1),
    a span:nth-child(3) {
      position: absolute;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, #002b9d, #34ffea);
    }

    a span:nth-child(2),
    a span:nth-child(4) {
      position: absolute;
      width: 5px;
      height: 100%;
      background: linear-gradient(to bottom, #002b9d, #34ffea);
    }

    a span:nth-child(1) {
      top: 0;
      left: 0;
      animation: animate1 2s linear infinite;
    }

    a span:nth-child(2) {
      top: 0;
      right: 0;
      animation: animate2 2s linear infinite;
      animation-delay: 1s;
    }

    a span:nth-child(3) {
      bottom: 0;
      left: 0;
      animation: animate3 2s linear infinite;
    }

    a span:nth-child(4) {
      top: 0;
      left: 0;
      animation: animate4 2s linear infinite;
      animation-delay: 1s;
    }

    @keyframes animate1 {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    @keyframes animate2 {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100%);
      }
    }

    @keyframes animate3 {
      0% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    @keyframes animate4 {
      0% {
        transform: translateY(100%);
      }

      100% {
        transform: translateY(-100%);
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div>
    <h1>DemraBazar</h1>
    <p>The link is invalid now ! Thank You</p>
    <a href="{% url 'login' %}">
      <span></span>
      <span></span>
      <span></span>
      <span></span>LogIn
    </a>
  </div>
</body>

</html>
