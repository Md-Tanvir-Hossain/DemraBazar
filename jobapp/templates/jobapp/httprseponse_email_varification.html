  <style>
    * {
      margin: 0;
      font-family: Arial;
      box-sizing: border-box;
      background-color: #213b52;
    }
 
    form,
    input,
    textarea {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .contact-form {
      padding: 20px;
      border-radius: 10px;
      margin-right: 5%;
    }

    .input-field,
    .textarea-field {
      background-color: white;
      padding: 8px;
      border: 2px solid white;
      border-radius: 5px;
      width: 35%;
      margin-bottom: 10px;
      margin-left: 35%;
      transition: border-color 0.5s ease;
    }

    .head2 {
      margin-left: 10%;
      font-weight: bold;
      padding: 10px 20px;
      width: 80%;
      text-align: center;
    }
    @keyframes slideInFromTop {
      0% {
          transform: translateY(-100%);
      }
      100% {
          transform: translateY(0);
      }
  }
    h1 {
      font-size: 2em;
      overflow: hidden;
      white-space: nowrap;
      animation: slideInFromTop 1s ease-in-out;
    }
  
    h1 {
      font-size: 2em;
      overflow: hidden;
      white-space: nowrap;
      animation: slideInFromTop 1s ease-in-out;
  }
h1 {
      font-size: 2em;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      transition: color 0.3s ease-in-out;
  }

  h1::after {
      content: '';
      display: block;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #007bff; /* Set the underline color */
      transition: width 0.3s ease-in-out;
  }

  h1:hover {
      color: #007bff; /* Change the text color on hover */
  }

  h1:hover::after {
      width: 100%; /* Expand the underline on hover */
  }

    .navbar {
      height: 105px;
      background-color: #213b52;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      border-bottom: 1.5px solid white;
    }

    .logo a {
      width: 10%;
      height: 50px;
      color: white;
      text-decoration: none;
      margin-right: 5%;
    }

    .cool-button {
      position: relative;
      display: inline-block;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #3498db;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      overflow: hidden;
      z-index: 1;
      background-image: linear-gradient(45deg, #3498db, #e74c3c, #1abc9c, #f39c12);
      background-size: 400% 400%;
      animation: gradientAnimation 7s infinite;
      margin-left: 49%;
    }

    @keyframes gradientAnimation {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    #footer {
      background-image: url("footer-bg.jpg");
      color: #fff;
      font-size: 14px;
      position: absolute;
      text-align: center;
      bottom: 3%;
      left: 0;
      right: 0;
     
    }

    .footer-top {
      position: relative;
      text-align: center;
      padding: 60px;
    }

    .footer-top h3 {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      position: relative;
      font-family: "Poppins", sans-serif;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .footer-top h4 {
      font-size: 15px;
      font-style: italic;
      margin: 30px 0 0 0;
      padding: 0;
    }

    .footer-bottom {
      border-top: 1.5px solid white;
      position: relative;
      padding-top: 40px;
      padding-bottom: 30px;
    }

    .copyright {
      text-align: center;
    }

    @media only screen and (max-width: 768px) {
      body {
        font-size: 14px;
      }

      .container {
        margin-right: 0;
        padding: 10px;
      }

      h1 {
        font-size: 1.5em;
        margin-left: 0;
      }

      .input-field,
      .textarea-field {
        width: 100%;
        margin-left: 0;
      }

      .head2 {
        margin-left: 10%;
        font-size: 1.5em;
        text-align: center;
      }

      .cool-button {
        margin-left: 30%;
      }
    }
   .button{
    margin-left: 45%;
   }
   .btn {
    position: absolute;
    bottom: 7vh;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    overflow: hidden;
    padding: 20px 40px;
    font-size: 1.5em;
    text-decoration: none;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;
    box-shadow: 0 20px 50px rgb(255 255 255 / 5%);
    margin-bottom: 20%;
  }

  .btn:before {
    position: absolute;
    width: 50%;
    top: 2px;
    left: 2px;
    bottom: 2px;
    content: "";
    background: rgb(142 255 240 / 10%);
  }

  .btn span:nth-child(1),
  .btn span:nth-child(3) {
    position: absolute;
    width: 100%;
    height: 5px;
    background: linear-gradient(to right, #002b9d, #34ffea);
  }

  .btn span:nth-child(2),
  .btn span:nth-child(4) {
    position: absolute;
    width: 5px;
    height: 100%;
    background: linear-gradient(to bottom, #002b9d, #34ffea);
  }

  .btn span:nth-child(1) {
    top: 0;
    left: 0;
    animation: animate1 2s linear infinite;
  }

  .btn span:nth-child(2) {
    top: 0;
    right: 0;
    animation: animate2 2s linear infinite;
    animation-delay: 1s;
  }

  .btn span:nth-child(3) {
    bottom: 0;
    left: 0;
    animation: animate3 2s linear infinite;
  }

  .btn span:nth-child(4) {
    top: 0;
    left: 0;
    animation: animate4 2s linear infinite;
    animation-delay: 1s;
  }
 
  @keyframes animate1 {
    0% {
      transform: translateX(-100%);
    }

    100% {
      transform: translateX(100%);
    }
  }

  @keyframes animate2 {
    0% {
      transform: translateY(-100%);
    }

    100% {
      transform: translateY(100%);
    }
  }

  @keyframes animate3 {
    0% {
      transform: translateX(100%);
    }

    100% {
      transform: translateX(-100%);
    }
  }

  @keyframes animate4 {
    0% {
      transform: translateY(100%);
    }

    100% {
      transform: translateY(-100%);
    }
  }

  @keyframes fadeIn {
    0% {
      opacity: 0;
    }

    100% {
      opacity: 1;
    }
  }
  @media (max-width: 768px) {

    .btn {
      margin-bottom: 80%;
      font-size: 20px;
    }
  }
  </style>
</head>
