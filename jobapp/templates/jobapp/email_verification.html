<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

  <title>DemraBazar</title>
  <meta content="" name="description" />
  <meta content="" name="keywords" />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css?family=Roboto:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * {
      margin: 0px;
      font-family: Arial;
      border: border-box;
      background-color: #213b52;
    }

    .navbar {
      height: 100px;
      background-color: #213b52;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      border-bottom: 1.5px solid white;
    }

    .nav-logo {
      height: 50px;
      width: 100px;
    }

    .logo a {
      width: 25%;
      height: 50px;
      color: white;
      margin-right: 100%;
    }

    .hi {
      margin-right: 80%;
    }

    .border {
      border: 1.5px solid transparent;
    }

    .border:hover {
      border: 1.5px solid white;
    }

    .add-icon {
      display: flex;
      align-items: center;
    }

    span {
      font-size: 0.7rem;
    }

    .nov-second {
      font-size: 0.83rem;
      font-weight: 700;
    }

    .nav-cart i {
      font-size: 35px;
    }

    .nav-cart {
      font-size: 0.85rem;
      font-weight: 700;
    }

    #footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      background-image: url("footer-bg.jpg");
      color: #fff;
      font-size: 14px;
    }

    .container footer-bottom clearfix {
      background-image: url("footer-bg.jpg");
      background-size: cover;
    }

    #footer::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background: #213b52;
      z-index: 1;
    }

    #footer .footer-top {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px;
      margin-bottom: 1%;
    }

    #footer .footer-top h3 {
      font-size: 35px;
      font-weight: 700;
      color: #fff;
      position: relative;
      font-family: "Poppins", sans-serif;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    #footer .footer-top p {
      font-size: 15;
      font-style: italic;
      margin: 30px 0 0 0;
      padding: 0;
    }

    #footer .footer-top .footer-newsletter {
      text-align: center;
      font-size: 15px;
      margin-top: 30px;
    }

    #footer .footer-top .footer-newsletter form {
      background: #fff;
      padding: 6px 10px;
      position: relative;
      border-radius: 50px;
      box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    #footer .footer-top .footer-newsletter form input[type=email] {
      border: 0;
      padding: 4px 8px;
      width: calc(100% - 100px);
    }

    #footer .footer-top .footer-newsletter form input[type=submit] {
      position: absolute;
      top: 0;
      right: -1px;
      bottom: 0;
      border: 0;
      background: none;
      font-size: 16px;
      padding: 0 20px;
      background: #fdc134;
      color: #fff;
      transition: 0.3s;
      border-radius: 50px;
      box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1);
    }

    #footer .footer-top .footer-newsletter form input[type=submit]:hover {
      background: #fcb102;
    }

    #footer .footer-bottom {
      border-top: 1.5px solid white;
      z-index: 2;
      position: relative;
      padding-top: 50px;
      padding-bottom: 60px;
    }

    #footer .copyright {
      text-align: center;
      float: left;
      margin-left: 42%;
    }

    #footer .credits {
      float: right;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 768px) {

      #footer .copyright{
        padding: 5px;
        float: none;
        text-align: center;
        margin-left: 0%;
        font: bold;
        margin-top: 5%;
      }
      #footer .credits {
        padding: 5px;
        float: none;
        text-align: center;
        margin-left: 0%;
        font: bold;
        margin-bottom: 100%;
      }
      p{
        margin-top: 10%;
      }
    }
     p {
      text-align: center;
      font-size: 2em;
      animation: fadeIn 1s ease-in-out;
      margin-top: 15vh;
    }

    .btn {
      position: absolute;
      bottom: 7vh;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      overflow: hidden;
      padding: 20px 40px;
      font-size: 1.5em;
      text-decoration: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      box-shadow: 0 20px 50px rgb(255 255 255 / 5%);
      margin-bottom: 20%;
    }

    .btn:before {
      position: absolute;
      width: 50%;
      top: 2px;
      left: 2px;
      bottom: 2px;
      content: "";
      background: rgb(142 255 240 / 10%);
    }

    .btn span:nth-child(1),
    .btn span:nth-child(3) {
      position: absolute;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, #002b9d, #34ffea);
    }

    .btn span:nth-child(2),
    .btn span:nth-child(4) {
      position: absolute;
      width: 5px;
      height: 100%;
      background: linear-gradient(to bottom, #002b9d, #34ffea);
    }

    .btn span:nth-child(1) {
      top: 0;
      left: 0;
      animation: animate1 2s linear infinite;
    }

    .btn span:nth-child(2) {
      top: 0;
      right: 0;
      animation: animate2 2s linear infinite;
      animation-delay: 1s;
    }

    .btn span:nth-child(3) {
      bottom: 0;
      left: 0;
      animation: animate3 2s linear infinite;
    }

    .btn span:nth-child(4) {
      top: 0;
      left: 0;
      animation: animate4 2s linear infinite;
      animation-delay: 1s;
    }
   
    @keyframes animate1 {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    @keyframes animate2 {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100%);
      }
    }

    @keyframes animate3 {
      0% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    @keyframes animate4 {
      0% {
        transform: translateY(100%);
      }

      100% {
        transform: translateY(-100%);
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }
    @media (max-width: 768px) {

      .btn {
        margin-bottom: 80%;
      }
    }
    h3 {
      color: rgb(0, 0, 0); /* Text color */
      font-family: 'Arial', sans-serif; /* Font family */
      font-size: 24px; /* Font size */
      font-weight: bold; /* Font weight */
      text-align: center; /* Text alignment */
      margin-bottom: 20px; /* Bottom margin */
      text-transform: uppercase; /* Uppercase text */
      letter-spacing: 2px; /* Letter spacing */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Text shadow */
    }
    h3 {
      font-size: 3em;
      overflow: hidden;
      white-space: nowrap;
      transition: transform 0.3s ease-in-out;
    }

    h3:hover {
      transform: scale(1.1);
      /* Scale the text on hover */
    }
  </style>
</head>

<body>
  <header>
    <div class="navbar">
      <div class="container d-flex align-items-center justify-content-between">
        {% csrf_token %}
        <div class="logo">
          <h1 class="hi">
            <a class="tai">DemraBazar</a>
          </h1>
        </div>
      </div>
    </div>
  </header>
  <div>
    <p style="color:#fff">Thank you Sir. You can now login to your account.</p>
    <a class="btn" href="{% url 'login' %}">
      <span></span>
      <span></span>
      <span></span>
      <span></span>Login
    </a>
  </div>




  <footer id="footer">
    <div class="footer-top">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <h3>DemraBazar</h3>
            <h4 style="width: 98.5% ; font-size:150% ; font:bold">"Unlock Opportunities, Subscribe for Success!".</h4>
          </div>
        </div>
      </div>
    </div>
    <div class="container footer-bottom clearfix">
      <div class="copyright">
        &copy; Copyright <strong><span>DemraBazar</span></strong>. All Rights Reserved
      </div>
    </div>
  </footer>
</body>

</html>
